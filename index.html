<meta charset="utf-8">
<title>James Mullally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500&family=DM+Mono&display=swap">
<style>
  /* Layout: one full-screen canvas showing the lake, with a few small labels
     pinned to the corners on top of it. All scene colours live in the script
     (they change with the time of day); the script also updates --ink and
     --muted so the corner labels stay readable against the current sky. */
  :root {
    --ink: #14303F;      /* name, live skip count */
    --muted: #21475A;    /* links, hint, secondary text */
    --page: #BBB5A8;     /* shown for an instant before the canvas paints */
    --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "DM Mono", ui-monospace, Consolas, monospace;
  }

  html, body { height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overscroll-behavior: none;
  }

  /* The scene. touch-action: none lets a finger drag throw the stone instead of scrolling. */
  #lake {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
    -webkit-user-select: none; user-select: none;
  }
  #lake.holding { cursor: grabbing; }

  /* Corner labels. Each adds the phone's safe-area inset so it clears notches and system bars. */
  .corner {
    position: fixed; z-index: 2;
    font-size: 13px; letter-spacing: 0.02em; color: var(--muted);
  }
  .top-left {
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: max(20px, env(safe-area-inset-left, 0px));
    display: flex; align-items: baseline; gap: 14px;
  }
  .top-left h1 {
    margin: 0; font: 400 22px/1 var(--font-display); letter-spacing: 0.01em; color: var(--ink);
  }
  .top-right {
    top: calc(18px + env(safe-area-inset-top, 0px));
    right: max(20px, env(safe-area-inset-right, 0px));
  }
  .bottom-left {
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: max(20px, env(safe-area-inset-left, 0px));
    font-family: var(--font-data); font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .corner a, .corner button {
    color: var(--muted); font: inherit; letter-spacing: inherit;
    background: none; border: 0; padding: 6px 2px; margin: -6px -2px;
    text-decoration: underline; text-decoration-color: transparent;
    text-underline-offset: 4px; cursor: pointer;
    transition: color .2s, text-decoration-color .2s;
  }
  .corner a:hover, .corner button:hover { color: var(--ink); text-decoration-color: currentColor; }
  .corner a:focus-visible, .corner button:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px;
  }
  #count { color: var(--ink); }

  /* One-line instruction above the stone; fades out after the first throw. */
  #hint {
    position: fixed; z-index: 2; left: 0; right: 0;
    bottom: calc(104px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 13px; letter-spacing: 0.02em;
    color: var(--muted); pointer-events: none;
    transition: opacity .6s;
  }
  #hint.gone { opacity: 0; }
</style>

<canvas id="lake" role="img" aria-label="A lake seen from a shale beach. Flick the stone to skip it across the water."></canvas>

<header class="corner top-left">
  <h1>James Mullally</h1>
  <a href="https://www.linkedin.com/in/jamesmullally/" target="_blank" rel="noopener">LinkedIn</a>
</header>
<div class="corner top-right">
  <button id="sound" type="button" aria-pressed="true">Sound on</button>
</div>
<p class="corner bottom-left" aria-live="polite"><span id="count">0 skips</span> · best <span id="best">0</span></p>
<p id="hint">Flick the stone across the water</p>

<script>
/*
  The skipping-stone lake.

  Everything is drawn on one canvas, redrawn every animation frame. The page is
  organised in this order:

    1. Camera        how a point on the lake (in metres) becomes a pixel
    2. Time of day   four colour palettes blended by the visitor's clock, and
                     where the sun or moon sits
    3. Scenery       the things that are not the stone: clouds, birds, far shore,
                     boats, buoy, fish, ripples, beach; set up, moved and drawn
    4. Sound         two recordings: one for each skip, one for the final sink
    5. The stone     throwing it, its flight, skipping, hitting the buoy, sinking
    6. Frame         the per-frame update and the draw order
    7. Input         mouse, touch and keyboard
    8. Start-up

  Units: the lake is measured in metres. x is left/right of centre, y is height
  above the water, z is distance out from the viewer. Screen positions are CSS
  pixels. Times are seconds.
*/
(function () {
  'use strict';

  var canvas = document.getElementById('lake');
  var ctx = canvas.getContext('2d');
  var countEl = document.getElementById('count');
  var bestEl = document.getElementById('best');
  var hintEl = document.getElementById('hint');
  var soundBtn = document.getElementById('sound');

  // Visitors who ask their device for less motion get a still scene: the scenery
  // stops drifting and nothing spawns. Throwing still animates, since they start it.
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TAU = Math.PI * 2;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


  // ====================================================================
  // 1. Camera
  // ====================================================================
  // The viewer's eye is CAM_H metres above flat water, looking straight at the
  // horizon. Things farther away (larger z) are drawn smaller and closer to the
  // horizon line. Z_MIN is the nearest distance still on screen: water that
  // close lands on the bottom edge of the window.
  var CAM_H = 1.5, Z_MIN = 1.6;

  var w = 0, h = 0;   // canvas size in CSS pixels
  var dpr = 1;        // device pixels per CSS pixel (capped at 2 to keep phones fast)
  var cx = 0;         // screen x of the centre line
  var hz = 0;         // screen y of the horizon
  var f = 1;          // focal length in pixels; bigger means more zoomed in

  // Called at start-up and whenever the window changes size.
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    cx = w / 2;
    hz = Math.round(h * 0.42);            // horizon 42% of the way down
    f = (h - hz) * Z_MIN / CAM_H;         // chosen so z = Z_MIN sits on the bottom edge
  }

  // Lake position (metres) to screen position (pixels).
  function project(x, y, z) {
    return { x: cx + f * x / z, y: hz + f * (CAM_H - y) / z };
  }

  // The reverse, for one axis: how far out is a point at screen height sy, given it
  // is y0 metres above the water? Used to place the stone under the pointer.
  function zFromScreenY(sy, y0) {
    return f * (CAM_H - y0) / Math.max(sy - hz, 0.1 * (h - hz));
  }

  // Half the width of the visible lake, in metres, at distance z.
  function halfWidthAt(z) { return z * (w / 2) / f; }


  // ====================================================================
  // 2. Time of day
  // ====================================================================
  // Four palettes. The scene shows a blend of two of them, chosen by the hour on
  // the visitor's own clock, so it is dawn there when it is dawn for them.
  var PALETTES = {
    day: { 'sky-top': '#74B7E8', 'sky-low': '#DDF0F8', 'water-far': '#A3D0E4', 'water-near': '#3E8DB4',
      ink: '#14303F', muted: '#21475A', stone: '#4A4F52', ripple: '#F4FBFD', sun: '#FFE7A0', cloud: '#FFFFFF',
      ridge: '#84AD86', shale: '#BBB5A8', 'shale-wet': '#918B80', grass: '#5E8C5A', hull: '#2F3E46',
      sail: '#FFFFFF', buoy: '#E8A33D', fish: '#EAF3F6' },
    dawn: { 'sky-top': '#8AA6D6', 'sky-low': '#FAD0B4', 'water-far': '#E6C3B8', 'water-near': '#5E84A8',
      ink: '#1B2A40', muted: '#263A55', stone: '#4A4C52', ripple: '#FFF4EA', sun: '#FFC58A', cloud: '#FFE6DC',
      ridge: '#7E96A0', shale: '#B8ABA2', 'shale-wet': '#8F8482', grass: '#5A8259', hull: '#2F3E46',
      sail: '#FFF3EA', buoy: '#E8893D', fish: '#F3E9E6' },
    sunset: { 'sky-top': '#7C86BE', 'sky-low': '#F1B8B4', 'water-far': '#D8A8B0', 'water-near': '#3F5C8A',
      ink: '#1A2238', muted: '#1E2740', stone: '#45474E', ripple: '#FFE9D6', sun: '#FFB07A', cloud: '#FFD3C8',
      ridge: '#9A8E70', shale: '#B59F92', 'shale-wet': '#8C7A72', grass: '#4E7350', hull: '#232B3A',
      sail: '#FFE4D0', buoy: '#E0703A', fish: '#F6DFD2' },
    night: { 'sky-top': '#0A1626', 'sky-low': '#1E3550', 'water-far': '#173048', 'water-near': '#081320',
      ink: '#E6EEF2', muted: '#A9BCC6', stone: '#AEB8BC', ripple: '#BFD9E6', sun: '#F3F0DC', cloud: '#2C4460',
      ridge: '#12283A', shale: '#35373B', 'shale-wet': '#26282C', grass: '#2E4A38', hull: '#0A1118',
      sail: '#C9D4DA', buoy: '#C98A35', fish: '#BFD0D6' }
  };

  // Which palette applies at which hour (0-24). Between two entries the colours
  // blend, so 5:00-6:15 is night turning to dawn, 6:15-7:45 dawn turning to day,
  // and so on. Day holds from 7:45 to 17:15.
  var SCHEDULE = [[0, 'night'], [5, 'night'], [6.25, 'dawn'], [7.75, 'day'],
    [17.25, 'day'], [18.75, 'sunset'], [20.25, 'night'], [24, 'night']];

  var C = {};         // the current colours as CSS strings, e.g. C.sun, C['sky-top']
  var RGB = {};       // the same colours as [r, g, b] numbers, for mixing
  var nightAmt = 0;   // 0 in daylight, 1 in full night; fades stars and lamps in
  var hourNow = 12;   // the hour the scene is currently showing

  function hexToRgb(v) {
    return [parseInt(v.substr(1, 2), 16), parseInt(v.substr(3, 2), 16), parseInt(v.substr(5, 2), 16)];
  }
  function rgbString(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  // A colour part-way between two current palette colours: mix('ridge', 'sun', 0.3)
  // is the ridge colour pulled 30% toward the sun colour.
  function mix(a, b, t) {
    var p = RGB[a], q = RGB[b];
    return rgbString([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t]);
  }

  // The visitor's local time as a decimal hour. window.__hour, if set, overrides
  // it (see the debug hooks at the bottom).
  function currentHour() {
    if (typeof window.__hour === 'number') return window.__hour;
    var d = new Date();
    return d.getHours() + d.getMinutes() / 60;
  }

  // Work out the colours for the current hour. Runs at start-up and once a minute.
  function applyTime() {
    var hr = currentHour(), from = SCHEDULE[0], to = SCHEDULE[1];
    for (var i = 0; i < SCHEDULE.length - 1; i++) {
      if (hr >= SCHEDULE[i][0] && hr <= SCHEDULE[i + 1][0]) { from = SCHEDULE[i]; to = SCHEDULE[i + 1]; break; }
    }
    // u runs 0 to 1 across the gap between the two schedule entries, eased so the
    // change starts and ends gently.
    var u = to[0] === from[0] ? 0 : (hr - from[0]) / (to[0] - from[0]);
    u = u * u * (3 - 2 * u);

    var A = PALETTES[from[1]], B = PALETTES[to[1]];
    for (var key in A) {
      var a = hexToRgb(A[key]), b = hexToRgb(B[key]);
      RGB[key] = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
      C[key] = rgbString(RGB[key]);
    }
    nightAmt = (from[1] === 'night' ? 1 - u : 0) + (to[1] === 'night' ? u : 0);
    hourNow = hr;

    // Hand the two text colours to the stylesheet so the corner labels follow the sky.
    var rootStyle = document.documentElement.style;
    rootStyle.setProperty('--ink', C.ink);
    rootStyle.setProperty('--muted', C.muted);
    document.body.style.background = C.shale;
  }

  // Where the sun or moon is on screen. The view faces east, so the sun comes up
  // over the far shore, climbs up and to the right (toward the south), and has
  // left the top of the frame by late morning; in the afternoon and at sunset it
  // is behind the viewer and not drawn. The moon rises over the far shore in the
  // evening, kept to the right so it stays clear of the middle of the view.
  function skyBody() {
    var u;
    if (hourNow >= 5.9 && hourNow <= 12) {            // sun
      u = (hourNow - 5.9) / 6.1;
      return { x: w * (0.5 + 0.42 * u), y: hz + 6 - u * 1.25 * hz, vis: true };
    }
    if (hourNow >= 19.5 || hourNow <= 5.5) {          // moon
      u = ((hourNow + 24 - 19.5) % 24) / 10;
      return { x: w * (0.8 + 0.1 * u), y: hz + 6 - Math.sin(u * Math.PI / 2) * 0.8 * hz, vis: true };
    }
    return { x: 0, y: -999, vis: false };
  }


  // ====================================================================
  // 3. Scenery
  // ====================================================================
  // Most scenery is generated once here with random positions, so every visit
  // looks slightly different, then moved a little each frame by updateScene()
  // and drawn by the draw... functions below.

  // --- Sky ---
  // Clouds: five, each a row of overlapping ovals. x and y are fractions of the
  // window; they drift right and wrap around.
  var clouds = [];
  for (var ci = 0; ci < 5; ci++) {
    var puffs = [];
    for (var pi = 0; pi < 5; pi++) puffs.push({ dx: -1.6 + pi * 0.8 + rnd(-0.2, 0.2), dy: rnd(-0.45, 0), r: rnd(0.65, 1.05) });
    clouds.push({ x: ci * 0.3 - 0.1 + rnd(-0.06, 0.06), y: rnd(0.05, 0.25), s: rnd(0.7, 1.35), sp: rnd(0.004, 0.009), puffs: puffs });
  }

  // Stars: fixed points in the sky that only show at night.
  var stars = [];
  for (var si = 0; si < 46; si++) stars.push({ u: Math.random(), v: Math.random() * 0.9, ph: rnd(0, TAU), r: rnd(0.5, 1.3) });

  // Birds: one small flock at a time crosses the sky, then a pause before the next.
  var birds = null, nextBirds = 14;
  function newFlock(alreadyInView) {
    var dir = Math.random() < 0.5 ? 1 : -1, list = [];
    var n = 3 + Math.floor(Math.random() * 4);
    for (var i = 0; i < n; i++) list.push({ dx: -i * 20 + rnd(-5, 5), dy: (i % 2 ? 1 : -1) * i * 6 + rnd(-3, 3), ph: rnd(0, TAU) });
    return { x: alreadyInView ? w * 0.28 : (dir > 0 ? -40 : w + 40), y: rnd(0.08, 0.28) * h, v: dir * rnd(38, 58), dir: dir, list: list };
  }

  // --- Far shore ---
  // The far side of the lake: one long,
  // even ridge about two miles off, a patchwork of pale fields and darker
  // woodlots, trees along the waterline and a scatter of cottages. Positions are
  // fractions of the window width (u) and of the ridge height.
  var farFields = [], farWoods = [], cottages = [];
  for (var ff = 0; ff < 18; ff++) farFields.push({ u: rnd(-0.02, 1), wd: rnd(0.03, 0.09), lo: rnd(0.25, 0.5), hi: rnd(0.6, 0.95), sk: rnd(-0.012, 0.012), tone: Math.random() });
  for (var fw = 0; fw < 14; fw++) farWoods.push({ u: Math.random(), wd: rnd(0.02, 0.06), y: rnd(0.35, 0.9), ht: rnd(0.1, 0.2) });
  for (var fc = 0; fc < 16; fc++) cottages.push({ u: rnd(0.02, 0.98), wd: rnd(2, 4), lit: Math.random() < 0.6 });

  // --- On the water ---
  // Glints: short flickering highlights scattered across the surface.
  var glints = [];
  for (var gl = 0; gl < 26; gl++) {
    glints.push({ u: rnd(-1, 1), z: 2.2 * Math.pow(45, Math.random()), len: rnd(0.25, 1.15), ph: rnd(0, TAU), sp: rnd(0.3, 0.8) });
  }

  // Sailboats: two, far out, crossing in opposite directions and wrapping around.
  // x, z and len are metres; v is metres per second (its sign is the heading).
  var boats = [
    { x: -22, z: 78, v: 0.9, len: 6.5 },
    { x: 70, z: 170, v: -0.7, len: 8 }
  ];

  // The marker buoy: a fixed, solid thing to aim at. kick is how hard it is
  // currently rocking (set when a stone hits or lands near it, then dies away).
  var buoy = { x: 2.2, z: 12, kick: 0 };
  var BUOY_R = 0.3;       // collision radius, metres
  var BUOY_TOP = 0.75;    // a stone flying higher than this passes over it

  // Fish: every few seconds one jumps in a short arc. Each lives for one jump.
  var fish = [], nextFish = 3;

  // Ripples: expanding rings on the water, added by skips, the sink, fish, the
  // buoy, and now and then on their own.
  var ripples = [], nextRipple = 1.5;
  function addRipple(x, z, strength, rings) {
    ripples.push({ x: x, z: z, age: 0, strength: strength, rings: rings, life: 3.2 + strength });
  }

  // --- The beach ---
  // A shale beach: flat grey stones scattered over it, some paler than others.
  // u is across the window, v is down the beach, q is how flattened the oval is.
  var pebbles = [];
  for (var bi = 0; bi < 80; bi++) pebbles.push({ u: Math.random(), v: Math.random(), r: rnd(3, 9), a: rnd(0.22, 0.6), q: rnd(0.4, 0.68), light: Math.random() < 0.3 });

  // A tuft of beach grass in the bottom-right corner.
  var blades = [];
  for (var gi = 0; gi < 9; gi++) blades.push({ x: 18 + gi * 9 + rnd(-3, 3), len: rnd(42, 88), ph: rnd(0, TAU), lean: rnd(-0.3, 0.3) });

  // Screen y of the waterline at screen x: a gentle curve across the bottom.
  function shoreY(x) {
    return h - Math.max(96, h * 0.12) - 16 * Math.sin(x / w * 3.3 + 0.5);
  }

  // Move the scenery forward by dt seconds. Skipped entirely under reduced motion.
  function updateScene(dt) {
    var i;

    for (i = 0; i < clouds.length; i++) {
      clouds[i].x += clouds[i].sp * dt;
      if (clouds[i].x > 1.25) clouds[i].x = -0.25;          // off the right edge: re-enter on the left
    }

    for (i = 0; i < boats.length; i++) {
      var b = boats[i], edge = halfWidthAt(b.z) + b.len;
      b.x += b.v * dt;
      if (b.x > edge) b.x = -edge; else if (b.x < -edge) b.x = edge;
    }

    // Start a fish jump when the timer runs out; a ripple marks where it leaves the water.
    nextFish -= dt;
    if (nextFish <= 0) {
      nextFish = rnd(5, 11);
      var fz = rnd(5, 22);
      var jump = { x: rnd(-0.7, 0.7) * halfWidthAt(fz), z: fz, t: 0, dur: 0.85, vx: (Math.random() < 0.5 ? -1 : 1) * rnd(1, 1.6), top: rnd(0.4, 0.65) };
      fish.push(jump);
      addRipple(jump.x, jump.z, 0.4, 2);
    }
    // Advance jumps in progress; a second ripple marks where each lands.
    for (i = fish.length - 1; i >= 0; i--) {
      fish[i].t += dt;
      if (fish[i].t >= fish[i].dur) {
        addRipple(fish[i].x + fish[i].vx * fish[i].dur, fish[i].z, 0.5, 2);
        fish.splice(i, 1);
      }
    }

    // A stray ripple somewhere on the lake every few seconds.
    nextRipple -= dt;
    if (nextRipple <= 0) {
      nextRipple = rnd(1.5, 4);
      var rz = 3 * Math.pow(14, Math.random());
      addRipple(rnd(-0.9, 0.9) * halfWidthAt(rz), rz, 0.28, 2);
    }

    // Fly the flock across; once it has left, wait a while and send another.
    if (birds) {
      birds.x += birds.v * dt;
      if (birds.x < -260 || birds.x > w + 260) { birds = null; nextBirds = rnd(8, 18); }
    } else {
      nextBirds -= dt;
      if (nextBirds <= 0) birds = newFlock(false);
    }
  }

  // --- Drawing helpers ---
  // Fill a polygon given as a flat list of points: [x0, y0, x1, y1, ...].
  function poly(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fill();
  }

  // --- Drawing the scenery (t is the running time in seconds, used for motion) ---

  // Sky gradient above the horizon, water gradient below it.
  function drawBackdrop() {
    var sky = ctx.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, C['sky-top']); sky.addColorStop(1, C['sky-low']);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, hz);

    var water = ctx.createLinearGradient(0, hz, 0, h);
    water.addColorStop(0, C['water-far']); water.addColorStop(1, C['water-near']);
    ctx.fillStyle = water; ctx.fillRect(0, hz, w, h - hz);
  }

  // Stars, then the sun or moon, then clouds, then birds: back to front.
  function drawSky(t) {
    var i;

    // Stars twinkle, and fade in and out with nightAmt.
    if (nightAmt > 0.02) {
      ctx.fillStyle = C.sun;
      for (i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.globalAlpha = (0.35 + 0.35 * Math.sin(t * 1.3 + st.ph)) * nightAmt;
        ctx.beginPath(); ctx.arc(st.u * w, st.v * hz, st.r, 0, TAU); ctx.fill();
      }
    }

    // Sun or moon: a disc with two flat, see-through halos; the outer one breathes slightly.
    var body = skyBody(), sr = clamp(Math.min(w, h) * 0.045, 18, 40);
    if (body.vis) {
      ctx.fillStyle = C.sun;
      ctx.globalAlpha = 0.13; ctx.beginPath(); ctx.arc(body.x, body.y, sr * (2.7 + 0.12 * Math.sin(t * 0.8)), 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(body.x, body.y, sr * 1.75, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(body.x, body.y, sr, 0, TAU); ctx.fill();
    }

    // Clouds: each is one filled shape made of its ovals.
    ctx.fillStyle = C.cloud;
    ctx.globalAlpha = 0.92 - 0.17 * nightAmt;
    var unit = Math.max(16, Math.min(w, h) * 0.04);
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i], u = unit * c.s, px = c.x * w, py = c.y * h;
      ctx.beginPath();
      for (var k = 0; k < c.puffs.length; k++) {
        var p = c.puffs[k];
        ctx.moveTo(px + p.dx * u + p.r * u * 1.3, py + p.dy * u);
        ctx.ellipse(px + p.dx * u, py + p.dy * u, p.r * u * 1.3, p.r * u * 0.72, 0, 0, TAU);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Birds: each a shallow "v" whose wingtips flap up and down.
    if (birds) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalAlpha = 0.6;
      for (i = 0; i < birds.list.length; i++) {
        var bd = birds.list[i];
        var bx = birds.x + bd.dx * birds.dir, by = birds.y + bd.dy + Math.sin(t * 1.5 + bd.ph) * 2;
        var flap = Math.sin(t * 8 + bd.ph) * 4;
        ctx.beginPath();
        ctx.moveTo(bx - 7, by - 2 - flap); ctx.lineTo(bx, by); ctx.lineTo(bx + 7, by - 2 - flap);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  // The far shore, drawn as a low band sitting on the horizon.
  function drawFarShore() {
    var R = Math.max(14, h * 0.036);   // height of the ridge in pixels
    var x, i;

    // The ridge outline. Everything inside it is clipped to this shape, so fields
    // and woods can't poke above the skyline.
    ctx.save();
    ctx.fillStyle = C.ridge;
    ctx.beginPath(); ctx.moveTo(0, hz + 1);
    for (x = 0; x <= w + 8; x += 8) {
      var uu = x / w;
      ctx.lineTo(x, hz - R * (0.74 + 0.15 * Math.sin(uu * 3.1 + 0.4) + 0.07 * Math.sin(uu * 8.3 + 2)));
    }
    ctx.lineTo(w, hz + 1); ctx.closePath(); ctx.fill();
    ctx.clip();

    // Fields: pale, slightly slanted patches.
    for (i = 0; i < farFields.length; i++) {
      var fd = farFields[i], x0 = fd.u * w, ww = fd.wd * w, sk = fd.sk * w;
      poly([x0, hz - R * fd.lo, x0 + ww, hz - R * fd.lo, x0 + ww + sk, hz - R * fd.hi, x0 + sk, hz - R * fd.hi],
        mix('ridge', 'sun', 0.22 + 0.22 * fd.tone));
    }
    // Woodlots: darker flat ovals.
    ctx.fillStyle = mix('ridge', 'hull', 0.32);
    for (i = 0; i < farWoods.length; i++) {
      var wd = farWoods[i];
      ctx.beginPath(); ctx.ellipse(wd.u * w, hz - R * wd.y, wd.wd * w, R * wd.ht, 0, 0, TAU); ctx.fill();
    }

    ctx.fillStyle = mix('ridge', 'hull', 0.5);
    ctx.beginPath(); ctx.moveTo(0, hz + 1);
    for (x = 0; x <= w + 6; x += 6) ctx.lineTo(x, hz - R * (0.17 + 0.07 * Math.sin(x * 0.21) + 0.05 * Math.sin(x * 0.057 + 1)));
    ctx.lineTo(w, hz + 1); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Cottages: pale dashes at the water's edge by day; at night only some show, as lit windows.
    var lamps = nightAmt > 0.5;
    for (i = 0; i < cottages.length; i++) {
      var ct = cottages[i];
      if (lamps && !ct.lit) continue;
      ctx.fillStyle = lamps ? C.sun : C.sail;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(ct.u * w, hz - 3.5, lamps ? 2 : ct.wd, 2.5);
    }
    ctx.globalAlpha = 1;
  }

  // The shimmering path of light on the water under the sun or moon: a column of
  // short dashes that widen toward the viewer and flicker. Fainter when the sun is high.
  function drawSunPath(t) {
    var body = skyBody(), span = h - hz;
    if (!body.vis || body.y < -40) return;
    var low = 1 - 0.65 * clamp((hz - body.y) / hz, 0, 1);
    ctx.strokeStyle = C.sun; ctx.lineCap = 'round';
    for (var i = 0; i < 20; i++) {
      var q = i / 19, y = hz + 5 + q * q * span * 0.7;
      var half = (6 + q * 46) * (0.6 + 0.4 * Math.sin(t * 1.9 + i * 2.3));
      ctx.globalAlpha = low * (0.5 - 0.2 * nightAmt) * (1 - q * 0.6) * (0.55 + 0.45 * Math.sin(t * 2.6 + i * 1.3));
      ctx.lineWidth = 1 + q * 1.5;
      var jx = Math.sin(t * 1.1 + i * 1.7) * (3 + q * 14);
      ctx.beginPath(); ctx.moveTo(body.x + jx - half, y); ctx.lineTo(body.x + jx + half, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawGlints(t) {
    ctx.strokeStyle = C.ripple; ctx.lineWidth = 1; ctx.lineCap = 'round';
    for (var i = 0; i < glints.length; i++) {
      var g = glints[i];
      var drift = reduceMotion ? 0 : Math.sin(t * 0.07 * g.sp + g.ph) * 0.4;
      var p = project(g.u * halfWidthAt(g.z) * 1.15 + drift, 0, g.z);
      var len = f * g.len / g.z;
      ctx.globalAlpha = reduceMotion ? 0.11 : 0.07 + 0.09 * (0.5 + 0.5 * Math.sin(t * g.sp + g.ph));
      ctx.beginPath(); ctx.moveTo(p.x - len / 2, p.y); ctx.lineTo(p.x + len / 2, p.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // A sailboat: two sails and a hull, drawn twice. The second pass is flipped
  // upside down, squashed and faint, which makes its reflection in the water.
  function drawBoat(b, t) {
    var p = project(b.x, 0, b.z), s = f * b.len / b.z, dir = b.v > 0 ? 1 : -1;
    for (var pass = 0; pass < 2; pass++) {
      ctx.save();
      ctx.translate(p.x, p.y + (pass ? s * 0.05 : 0));
      ctx.rotate(Math.sin(t * 0.9 + b.z) * 0.03);          // a slow rock
      ctx.scale(dir, pass ? -0.65 : 1);
      ctx.globalAlpha = pass ? 0.22 : 1;
      poly([0.05 * s, -0.92 * s, 0.05 * s, -0.13 * s, 0.44 * s, -0.13 * s], C.sail);       // mainsail
      poly([-0.02 * s, -0.8 * s, -0.02 * s, -0.13 * s, -0.36 * s, -0.13 * s], C.sail);     // jib
      poly([-0.5 * s, -0.08 * s, 0.52 * s, -0.08 * s, 0.38 * s, 0.03 * s, -0.42 * s, 0.03 * s], C.hull);
      ctx.restore();
    }
  }

  // Rings on the water. A circle lying flat on the lake looks like a wide, squashed
  // oval from the shore, flatter the farther away it is.
  function drawRipples() {
    ctx.strokeStyle = C.ripple;
    for (var k = 0; k < ripples.length; k++) {
      var rp = ripples[k];
      var c = project(rp.x, 0, rp.z);
      var fade = Math.pow(1 - rp.age / rp.life, 2);
      for (var n = 0; n < rp.rings; n++) {
        var rad = (rp.age - n * 0.24) * 0.85;               // each later ring starts a beat behind
        if (rad <= 0) continue;
        var rx = f * rad / rp.z;
        var ry = Math.min(rx * CAM_H / rp.z, rx * 0.6);
        ctx.globalAlpha = Math.min(0.6, rp.strength * fade * 0.7) * (1 - n * 0.25);
        ctx.lineWidth = clamp(f * 0.02 / rp.z, 0.6, 1.4);
        ctx.beginPath(); ctx.ellipse(c.x, c.y, rx, Math.max(ry, 0.4), 0, 0, TAU); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // The buoy: a shadow on the water, then a tapered body with a pale band and a
  // small top post. It bobs gently on its own and rocks hard when kicked.
  function drawBuoy(t) {
    var p = project(buoy.x, 0, buoy.z), s = f * 0.8 / buoy.z;
    var tilt = (reduceMotion ? 0 : Math.sin(t * 1.3) * 0.06) + buoy.kick * 0.3 * Math.sin(t * 9);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.16; ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.ellipse(0, s * 0.03, s * 0.34, s * 0.06, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.rotate(tilt);
    poly([-0.26 * s, 0, 0.26 * s, 0, 0.13 * s, -0.7 * s, -0.13 * s, -0.7 * s], C.buoy);
    poly([-0.2 * s, -0.3 * s, 0.2 * s, -0.3 * s, 0.17 * s, -0.46 * s, -0.17 * s, -0.46 * s], C.sail);
    poly([-0.05 * s, -0.7 * s, 0.05 * s, -0.7 * s, 0.05 * s, -0.92 * s, -0.05 * s, -0.92 * s], C.hull);
    ctx.restore();
  }

  // A jumping fish: an oval body and a tail, placed along its arc and turned to
  // point the way it is travelling.
  function drawFish(jump) {
    var u = jump.t / jump.dur;
    var at = function (uu) { return project(jump.x + jump.vx * jump.dur * uu, 4 * jump.top * uu * (1 - uu), jump.z); };
    var a = at(u), b = at(Math.min(1, u + 0.04));
    var s = f * 0.34 / jump.z, angle = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(angle);
    ctx.fillStyle = C.fish;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.5, s * 0.17, 0, 0, TAU); ctx.fill();
    poly([-0.42 * s, 0, -0.72 * s, -0.2 * s, -0.72 * s, 0.2 * s], C.fish);
    ctx.restore();
  }

  // The beach in the foreground, drawn over the near water.
  function drawShore(t) {
    var x;
    var lap = reduceMotion ? 6 : 7 + 5 * Math.sin(t * 0.9);   // how far up the water has washed

    // Wet shale: a darker band the water laps back and forth over.
    ctx.fillStyle = C['shale-wet'];
    ctx.beginPath(); ctx.moveTo(0, h);
    for (x = 0; x <= w + 12; x += 12) ctx.lineTo(x, shoreY(x) - lap + 2 * Math.sin(x * 0.05 + t * 1.3));
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

    // A pale line along the water's edge.
    ctx.strokeStyle = C.ripple; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
    ctx.beginPath();
    for (x = 0; x <= w + 12; x += 12) {
      var yy = shoreY(x) - lap + 2 * Math.sin(x * 0.05 + t * 1.3);
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke(); ctx.globalAlpha = 1;

    // Dry shale below it.
    ctx.fillStyle = C.shale;
    ctx.beginPath(); ctx.moveTo(0, h);
    for (x = 0; x <= w + 12; x += 12) ctx.lineTo(x, shoreY(x) + 6);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

    // Flat stones scattered over the dry part.
    for (var i = 0; i < pebbles.length; i++) {
      var pb = pebbles[i], px = pb.u * w, top = shoreY(px) + 18;
      ctx.fillStyle = pb.light ? mix('shale', 'sail', 0.45) : C.stone;
      ctx.globalAlpha = pb.a;
      ctx.beginPath(); ctx.ellipse(px, top + pb.v * Math.max(8, h - top - 10), pb.r, pb.r * pb.q, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Beach grass in the bottom-right corner, swaying.
    ctx.strokeStyle = C.grass; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (var g = 0; g < blades.length; g++) {
      var bl = blades[g], bx = w - bl.x;
      var sway = (reduceMotion ? 0 : Math.sin(t * 1.1 + bl.ph) * 7) + bl.lean * 26;
      ctx.beginPath(); ctx.moveTo(bx, h + 4);
      ctx.quadraticCurveTo(bx + sway * 0.2, h - bl.len * 0.6, bx + sway, h - bl.len);
      ctx.stroke();
    }
  }


  // ====================================================================
  // 4. Sound
  // ====================================================================
  // Two short public-domain recordings of a rock dropping into water (see
  // sounds/CREDITS.txt): plop-skip.mp3 plays, pitched up, for each skip, and
  // plop-sink.mp3 plays once when the stone finally goes under.
  //
  // Browsers only allow sound after the visitor has interacted with the page,
  // so the audio system and the recordings are set up on the first click, touch
  // or key press (wakeAudio), not at page load.
  var soundOn = true;
  var audio = null;                          // the browser's audio system, once started
  var clips = { skip: null, sink: null };    // the decoded recordings
  var clipsRequested = false;
  var lastSkipAt = -10;                      // when the previous skip sound started
  var lastRate = 0;                          // the pitch the previous skip sound used

  // The Sound on/off button. The choice is remembered for the next visit.
  try { soundOn = localStorage.getItem('stone-sound') !== 'off'; } catch (e) {}
  function showSoundState() {
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  showSoundState();
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn; showSoundState();
    try { localStorage.setItem('stone-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  });

  function wakeAudio() {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      if (!clipsRequested) { clipsRequested = true; loadClip('skip'); loadClip('sink'); }
    } catch (e) { audio = null; }
  }

  // Fetch and decode one recording, then note two things about it: its loudest
  // point (so both clips can be played at comparable volume) and where the sound
  // actually begins (both files open with a stretch of silence that must be
  // skipped, or every splash would be late). If loading fails the page is
  // simply silent.
  function loadClip(name) {
    fetch('sounds/plop-' + name + '.mp3')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(function (data) { return new Promise(function (ok, fail) { audio.decodeAudioData(data, ok, fail); }); })
      .then(function (buf) {
        var d = buf.getChannelData(0), peak = 0, onset = 0, i;
        for (i = 0; i < d.length; i++) { var a = Math.abs(d[i]); if (a > peak) peak = a; }
        for (i = 0; i < d.length; i++) { if (Math.abs(d[i]) > peak * 0.08) { onset = i; break; } }
        clips[name] = { buf: buf, start: Math.max(0, onset / buf.sampleRate - 0.004), peak: peak || 1 };
      })
      .catch(function () {});
  }

  // Play the splash for a stone touching the water z metres out. sink is true
  // for the final plunge, false for a skip.
  function splash(z, sink) {
    if (!soundOn || !audio) return;
    var clip = sink ? clips.sink : clips.skip;
    if (!clip) return;                                   // still loading
    try {
      var t = audio.currentTime;
      var near = clamp(5 / z, 0.15, 1);                  // quieter the farther out it lands
      var src = audio.createBufferSource(); src.buffer = clip.buf;
      var gain = audio.createGain();

      if (sink) {
        // The sink: the recording as it is, held at full volume for the first
        // half and then faded out.
        var dur = Math.min(1.4, clip.buf.duration - clip.start), vol = 0.7 * near / clip.peak;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.setValueAtTime(vol, t + dur * 0.5);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(gain); gain.connect(audio.destination);
        src.start(t, clip.start); src.stop(t + dur + 0.02);
      } else {
        // A skip. "close" is 0 when the last skip was a while ago and rises to 1
        // when this one follows right behind it; closely spaced skips are played
        // quieter and duller so a fast run stays gentle.
        var close = clamp((0.45 - (t - lastSkipAt)) / 0.3, 0, 1);
        lastSkipAt = t;

        // Pitched up (a small stone, not a big rock), at a different pitch from
        // the previous skip so repeats don't sound identical.
        var rate = rnd(1.3, 1.7);
        if (Math.abs(rate - lastRate) < 0.08) rate += rate < 1.5 ? 0.12 : -0.12;
        lastRate = rate;
        src.playbackRate.value = rate;

        // Volume shape: a near-instant attack, then a slow fade over about 0.7 s
        // so the tails of neighbouring skips overlap.
        var level = 0.4 * near * (1 - 0.5 * close) / clip.peak;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(level, t + 0.006);
        gain.gain.setTargetAtTime(0, t + 0.1, 0.16);

        // Roll off the sharp top end, more so for closely spaced skips.
        var soften = audio.createBiquadFilter(); soften.type = 'lowpass'; soften.Q.value = 0.5;
        soften.frequency.value = 7500 - 3500 * close;

        src.connect(soften); soften.connect(gain); gain.connect(audio.destination);
        src.start(t, clip.start); src.stop(t + 0.75);
      }
    } catch (e) {}
  }


  // ====================================================================
  // 5. The stone
  // ====================================================================
  var G = 9.8;             // gravity, m/s^2
  var SINK_SPEED = 3.5;    // a stone moving across the water slower than this (m/s) sinks at its next touch

  var stones = [];         // stones currently in flight (several can be out at once)
  var held = null;         // {x, y} screen position while the visitor is dragging a stone
  var samples = [];        // recent pointer positions, used to measure the flick
  var restAlpha = 1;       // opacity of the stone waiting on the beach; below 0 delays its return
  var throwId = 0;         // number of the most recent throw; the counter shows that throw
  var best = 0;            // most skips on this device, remembered between visits

  try { best = parseInt(localStorage.getItem('stone-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // Where the waiting stone sits on the beach, in screen pixels.
  function restPos() { return { x: cx, y: h - 62 }; }

  // Update the "N skips · best M" label in the corner.
  function setCount(n) {
    countEl.textContent = n + (n === 1 ? ' skip' : ' skips');
    if (n > best) {
      best = n; bestEl.textContent = best;
      try { localStorage.setItem('stone-best', String(best)); } catch (e) {}
    }
  }

  // Throw a stone. (sx, sy) is where it was let go on screen; (vxs, vys) is how
  // fast the pointer was moving at that moment, in pixels per second. Returns
  // false, throwing nothing, if the flick was too gentle or not away from the viewer.
  function launch(sx, sy, vxs, vys) {
    var speed = Math.hypot(vxs, vys);
    if (vys > -0.25 * h || speed < 0.35 * h) return false;

    // Flick strength from 0 (barely a throw) to 1 (about four screen-heights a
    // second or faster). It decides how many skips the stone is good for:
    // 2-3 when weak, around 15 at full strength.
    var power = clamp((speed / h - 0.35) / 3.65, 0, 1);
    var targetSkips = 1.5 + Math.pow(power, 1.3) * 12.5 + Math.random();

    var forwardSpeed = 6 + power * 20;                    // m/s out across the lake
    var lean = clamp(vxs / Math.abs(vys), -0.6, 0.6);     // sideways angle of the flick
    var z = Math.min(zFromScreenY(sy, 0.4), 9);           // start under the pointer, at hand height

    stones.push({
      id: ++throwId,
      x: (sx - cx) * z / f, y: 0.4, z: z,
      vx: forwardSpeed * lean * 0.5, vy: rnd(1.0, 1.5), vz: forwardSpeed,
      // The share of its speed the stone keeps at each skip, chosen so that it
      // drops below SINK_SPEED after about targetSkips of them.
      keep: Math.pow(SINK_SPEED / forwardSpeed, 1 / targetSkips),
      skips: 0, hitBuoy: false, spin: rnd(0, TAU)
    });

    setCount(0);
    restAlpha = -0.6;                 // the next stone fades in on the beach after a beat
    hintEl.classList.add('gone');
    return true;
  }

  // Move one stone forward by dt seconds. Returns false once it has sunk.
  function stepStone(s, dt) {
    var px = s.x, py = s.y, pz = s.z;      // where it was before this step

    s.vy -= G * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.spin += dt * 14;

    // --- Hitting the buoy ---
    // The buoy is solid. A fast stone covers a metre or so per frame, enough to
    // jump clean over the buoy between two frames, so this checks the whole line
    // travelled this step: find the point on that line nearest the buoy and see
    // whether it is within the buoy's radius and below its top. A stone can only
    // hit the buoy once.
    if (!s.hitBuoy) {
      var dx = s.x - px, dz = s.z - pz, len2 = dx * dx + dz * dz;
      var along = len2 ? clamp(((buoy.x - px) * dx + (buoy.z - pz) * dz) / len2, 0, 1) : 0;
      var nearX = px + dx * along, nearZ = pz + dz * along, nearY = py + (s.y - py) * along;
      var nx = nearX - buoy.x, nz = nearZ - buoy.z, dist = Math.hypot(nx, nz);
      if (dist < BUOY_R && nearY < BUOY_TOP) {
        s.hitBuoy = true;
        if (dist < 1e-4) { nx = 0; nz = -1; dist = 1; }       // dead centre: bounce straight back
        nx /= dist; nz /= dist;                              // direction from the buoy to the stone
        var into = s.vx * nx + s.vz * nz;
        if (into < 0) { s.vx -= 2 * into * nx; s.vz -= 2 * into * nz; }   // reflect off the side it struck
        s.vx *= 0.4; s.vz *= 0.4;                            // losing most of its speed
        s.x = buoy.x + nx * (BUOY_R + 0.02); s.z = buoy.z + nz * (BUOY_R + 0.02);
        s.y = Math.max(nearY, 0.05); s.vy = 1.8;             // and popping up a little
        buoy.kick = 2;
        addRipple(buoy.x, buoy.z, 0.6, 2);
        return true;
      }
    }

    if (s.y > 0) return true;              // still in the air

    // --- Touching the water ---
    var acrossSpeed = Math.hypot(s.vx, s.vz);
    var tooSteep = Math.abs(s.vy) > acrossSpeed * 0.95;      // coming down more than it is going along
    if (acrossSpeed < SINK_SPEED || tooSteep || s.z > 320) {
      // Sinks: a big ripple and the plunk.
      addRipple(s.x, s.z, 1.0, 3);
      if (Math.hypot(buoy.x - s.x, buoy.z - s.z) < 2) buoy.kick = Math.max(buoy.kick, 1);
      splash(s.z, true);
      return false;
    }

    // Skips: count it, ripple, splash, then bounce back up slower and lower.
    s.skips++;
    if (s.id === throwId) setCount(s.skips);
    addRipple(s.x, s.z, 0.55, 2);
    if (Math.hypot(buoy.x - s.x, buoy.z - s.z) < 2) buoy.kick = Math.max(buoy.kick, 1);   // a near miss rocks the buoy
    splash(s.z, false);

    var keep = s.keep * rnd(0.995, 1.005);                   // a touch of luck either way
    s.vx *= keep; s.vz *= keep;
    s.y = 0.001;
    s.vy = Math.min(Math.abs(s.vy) * 0.62, acrossSpeed * keep * 0.22) + 0.25;
    return true;
  }

  // A stone is a flat oval; spin makes it wobble slightly in flight.
  function drawStone(px, py, r, alpha, spin) {
    r = Math.max(r, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(px, py);
    ctx.rotate(Math.sin(spin || 0) * 0.12);
    ctx.fillStyle = C.stone;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.55, r * 0.78, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // The stone's shadow on the surface below it, which is what shows how high it is.
  function drawShadow(px, py, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.ellipse(px, py, Math.max(r, 1) * 1.5, Math.max(r * 0.32, 0.6), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawStones() {
    // Stones in flight, farthest first so nearer ones draw on top.
    stones.sort(function (a, b) { return b.z - a.z; });
    for (var j = 0; j < stones.length; j++) {
      var s = stones[j], r = f * 0.05 / s.z;
      var onWater = project(s.x, 0, s.z), inAir = project(s.x, s.y, s.z);
      drawShadow(onWater.x, onWater.y, r, 0.16);
      drawStone(inAir.x, inAir.y, r, 1, s.spin);
    }

    // Then either the stone being dragged, or the one waiting on the beach.
    if (held) {
      var heldZ = Math.min(zFromScreenY(held.y, 0.4), 9);
      drawStone(held.x, held.y, f * 0.05 / heldZ, 1, 0);
    } else if (restAlpha > 0) {
      var rest = restPos(), restR = f * 0.05 / zFromScreenY(rest.y, 0);
      drawShadow(rest.x, rest.y + restR * 0.7, restR, 0.14 * restAlpha);
      drawStone(rest.x, rest.y, restR, restAlpha, 0);
    }
  }


  // ====================================================================
  // 6. Frame
  // ====================================================================
  // Paint one frame. Order matters: later things cover earlier ones, so this
  // goes from the back of the scene to the front.
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS pixels on a sharper canvas
    drawBackdrop();
    drawSky(t);
    drawFarShore();
    drawSunPath(t);
    for (var i = boats.length - 1; i >= 0; i--) drawBoat(boats[i], t);
    drawGlints(t);
    drawRipples();
    drawBuoy(t);
    for (var k = 0; k < fish.length; k++) drawFish(fish[k]);
    drawShore(t);
    drawStones();
  }

  // Runs once per screen refresh: move everything, then draw it.
  var lastTime = 0;
  function frame(now) {
    var t = now / 1000;
    // Seconds since the last frame, capped so a stalled tab doesn't make stones leap.
    var dt = Math.min(0.033, lastTime ? t - lastTime : 0.016);
    lastTime = t;

    for (var i = stones.length - 1; i >= 0; i--) {
      if (!stepStone(stones[i], dt)) stones.splice(i, 1);
    }
    for (var k = ripples.length - 1; k >= 0; k--) {
      ripples[k].age += dt;
      if (ripples[k].age >= ripples[k].life) ripples.splice(k, 1);
    }
    buoy.kick *= Math.exp(-dt / 1.1);                         // the buoy settles
    if (restAlpha < 1) restAlpha = Math.min(1, restAlpha + dt * 1.6);
    if (!reduceMotion) updateScene(dt);

    draw(t);
    requestAnimationFrame(frame);
  }


  // ====================================================================
  // 7. Input
  // ====================================================================
  // Mouse and touch both arrive as "pointer" events. Pressing anywhere picks the
  // stone up, dragging carries it, and letting go throws it at whatever speed the
  // pointer was moving over the last tenth of a second.

  // The pointer's position inside the canvas, with a timestamp.
  function pointerAt(e) {
    var box = canvas.getBoundingClientRect();
    return { x: e.clientX - box.left, y: e.clientY - box.top, t: performance.now() };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button > 0) return;      // left button or touch only
    wakeAudio();
    var p = pointerAt(e);
    held = { x: p.x, y: p.y };
    samples = [p];
    canvas.classList.add('holding');
    // Keep receiving this pointer's moves even if it leaves the canvas.
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!held) return;
    var p = pointerAt(e);
    held.x = p.x; held.y = p.y;
    samples.push(p);
    if (samples.length > 12) samples.shift();
  });

  canvas.addEventListener('pointerup', function (e) {
    if (!held) return;
    var p = pointerAt(e);
    samples.push(p);
    // Flick speed: compare where the pointer is now with where it was about
    // 90 ms ago (the oldest sample inside that window).
    var earlier = samples[0];
    for (var i = 0; i < samples.length; i++) {
      if (p.t - samples[i].t <= 90) { earlier = samples[i]; break; }
    }
    var dt = Math.max((p.t - earlier.t) / 1000, 0.008);
    var thrown = launch(p.x, p.y, (p.x - earlier.x) / dt, (p.y - earlier.y) / dt);
    held = null;
    canvas.classList.remove('holding');
    if (!thrown) restAlpha = 0.2;       // not a throw: the stone drops back onto the beach
  });

  canvas.addEventListener('pointercancel', function () {
    held = null; canvas.classList.remove('holding');
  });

  // Keyboard: Space or Enter throws a medium-to-strong stone roughly straight
  // out, so the page works without a mouse. Ignored while a link or button has
  // focus, where those keys already mean "activate".
  window.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'A' || tag === 'BUTTON') return;
    e.preventDefault();
    wakeAudio();
    var rest = restPos();
    var v = h * rnd(1.6, 3.8);
    launch(rest.x, rest.y - 40, rnd(-0.2, 0.2) * v, -v);
  });


  // ====================================================================
  // 8. Start-up
  // ====================================================================
  window.addEventListener('resize', resize);
  resize();
  applyTime();
  setInterval(applyTime, 60000);      // re-check the clock every minute
  birds = newFlock(true);             // open with a flock already in the sky
  requestAnimationFrame(frame);

  // Debug hooks, for trying things from the browser console. Not used by the page.
  //   __setHour(6.5)   show the scene as it looks at 6:30 am (any hour 0-24)
  //   __throw(3, 0.2)  throw from the beach at 3 screen-heights a second, leaning right
  window.__setHour = function (hour) { window.__hour = hour; applyTime(); };
  window.__throw = function (screensPerSecond, lean) {
    var rest = restPos(), v = h * screensPerSecond;
    return launch(rest.x, rest.y - 40, (lean || 0) * v, -v);
  };
})();
</script>
